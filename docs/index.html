<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1b1d21; --muted:#6b6f78; --line:#e3e1da;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --good:#2e7d4f; --bad:#b4442f; --warn:#9a6a10;
  --band:rgba(31,95,139,.12); --gt:#c2410c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --panel:#1a1d22; --ink:#e7e8ea; --muted:#9a9fa8; --line:#2b2f36;
    --accent:#6fb0de; --accent-soft:#1d2c38; --good:#5dbb84; --bad:#e2765f; --warn:#d8a943;
    --band:rgba(111,176,222,.16); --gt:#f08a4b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.num,td.n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
header{padding:22px 24px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1a24}}
main{padding:18px 24px 48px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:22px;font-weight:600;margin-top:2px}
.kpi .d{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--muted);cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.panel{display:none}.panel.on{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input{min-width:240px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th.n,td.n{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
tr.sel{background:var(--accent-soft)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.muted{color:var(--muted)}
.range{color:var(--muted);font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#detail{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:none}
#detail h2{margin:0 0 2px;font-size:18px}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:12px}
@media (max-width:900px){.dgrid{grid-template-columns:1fr}}
.chartbox{position:relative;height:300px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
dt{color:var(--muted)}dd{margin:0}
h3{font-size:13px;font-weight:600;margin:16px 0 6px}
.prose{max-width:860px}
.prose p,.prose li{color:var(--ink)}
.prose code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--accent-soft);padding:1px 4px;border-radius:3px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 4px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Steam Estimator</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="actions" id="actions"></div>
</header>
<main>
  <div id="notes"></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs">
    <button class="tab on" data-p="games">Games</button>
    <button class="tab" data-p="backtest">Backtest</button>
    <button class="tab" data-p="how">How it works</button>
  </div>

  <section class="panel on" id="p-games">
    <div class="toolbar">
      <input id="q" placeholder="Search game, developer, publisher">
      <select id="grp"><option value="">All groups</option></select>
    </div>
    <div class="tablewrap"><table id="gt"><thead></thead><tbody></tbody></table></div>
    <div id="detail"></div>
  </section>

  <section class="panel" id="p-backtest">
    <div class="kpis" id="btk"></div>
    <div class="tablewrap"><table id="bt"><thead></thead><tbody></tbody></table></div>
    <div id="skipped"></div>
  </section>

  <section class="panel prose" id="p-how"></section>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const repo = D.run.repo, base = repo ? `https://github.com/${repo}` : null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN = v => v == null ? '—' : v >= 1e6 ? (v/1e6).toFixed(v>=1e7?1:2)+'M' : v >= 1e3 ? (v/1e3).toFixed(v>=1e4?0:1)+'k' : Math.round(v).toString();
const fmt$ = v => v == null ? '—' : '$' + fmtN(v);
const pct = (v, d=0) => v == null ? '—' : (v*100).toFixed(d) + '%';
const sPct = v => v == null ? '—' : (v>0?'+':'') + (v*100).toFixed(0) + '%';

// header
const when = new Date(D.run.generated_at);
$('#sub').textContent = `Last refreshed ${when.toLocaleString()} · ${D.games.length} games tracked`;
const acts = [];
if (base) {
  acts.push(`<a class="btn primary" target="_blank" href="${base}/actions/workflows/refresh.yml">Refresh now / add games ↗</a>`);
  acts.push(`<a class="btn" target="_blank" href="${base}/edit/main/config/ground_truth.csv">Edit ground truth ↗</a>`);
  acts.push(`<a class="btn" target="_blank" href="${base}/edit/main/config/watchlist.csv">Edit watchlist ↗</a>`);
}
acts.push(`<a class="btn" href="data/estimates.csv">estimates.csv</a>`, `<a class="btn" href="data/quarterly.csv">quarterly.csv</a>`, `<a class="btn" href="data/backtest.csv">backtest.csv</a>`);
$('#actions').innerHTML = acts.join('');
if (D.run.notes && D.run.notes.length) $('#notes').innerHTML = D.run.notes.map(n => `<div class="note">${esc(n)}</div>`).join('');

// kpis
const bm = D.backtest.model, bb = D.backtest.baseline;
const ok = D.games.filter(g => g.status === 'ok');
$('#kpis').innerHTML = [
  ['Games tracked', D.games.length, `${ok.length} with estimates`],
  ['Ground-truth milestones used', D.model.n_used, `${D.model.n_games} games`],
  ['Backtest: within ±30%', bm ? pct(bm.within_30) : '—', bb ? `flat-prior baseline ${pct(bb.within_30)}` : 'add milestones to backtest'],
  ['Uncertainty band', '±' + pct(Math.exp(D.assumptions.interval_z*D.model.sd)-1), `90% band · from ${D.model.sd_source}`],
].map(([l,v,d]) => `<div class="kpi"><div class="l">${l}</div><div class="v num">${v}</div><div class="d">${esc(d)}</div></div>`).join('');

// tabs
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.p));
});

// ---------- games table ----------
const cols = [
  ['Game', g => g.name, g => `${esc(g.name)}${g.group ? `<span class="tag">${esc(g.group)}</span>` : ''}`],
  ['Released', g => g.release || '', g => esc(g.release || '—')],
  ['Price', g => g.price ?? -1, g => g.is_free ? 'Free' : g.price == null ? '—' : '$' + g.price.toFixed(2) + (g.current_discount ? ` <span class="good">−${g.current_discount}%</span>` : ''), 1],
  ['Reviews', g => g.reviews ?? -1, g => fmtN(g.reviews), 1],
  ['Reviews 30d', g => g.reviews_30d ?? -1, g => fmtN(g.reviews_30d), 1],
  ['Positive', g => g.positive_pct ?? -1, g => pct(g.positive_pct), 1],
  ['CCU now', g => g.ccu ?? -1, g => fmtN(g.ccu), 1],
  ['Multiple', g => g.multiple ?? -1, g => g.multiple ? g.multiple.toFixed(0) + '×' : '—', 1],
  ['Est. units', g => g.units ?? -1, g => g.units == null ? `<span class="muted">${esc(shortStatus(g))}</span>` : `${fmtN(g.units)} <span class="range">${fmtN(g.units_lo)}–${fmtN(g.units_hi)}</span>`, 1],
  ['Est. units 30d', g => g.units_30d ?? -1, g => fmtN(g.units_30d), 1],
  ['Est. gross rev', g => g.gross ?? -1, g => fmt$(g.gross), 1],
  ['Est. net rev', g => g.net ?? -1, g => fmt$(g.net), 1],
];
function shortStatus(g){ const s = g.status || ''; return s.startsWith('free') ? 'F2P' : s.startsWith('fewer') ? 'too few reviews' : s.startsWith('waiting') ? 'pending crawl' : '—'; }
let sortI = 8, sortDir = -1, selected = null;
const groups = [...new Set(D.games.map(g => g.group).filter(Boolean))].sort();
$('#grp').innerHTML += groups.map(g => `<option>${esc(g)}</option>`).join('');
function drawGames(){
  const q = $('#q').value.toLowerCase(), grp = $('#grp').value;
  const rows = D.games.filter(g => (!grp || g.group === grp) &&
    (!q || [g.name, ...(g.developers||[]), ...(g.publishers||[]), g.group].join(' ').toLowerCase().includes(q)));
  rows.sort((a, b) => { const x = cols[sortI][1](a), y = cols[sortI][1](b); return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  $('#gt thead').innerHTML = '<tr>' + cols.map((c, i) => `<th class="${c[3]?'n':''}" data-i="${i}">${c[0]}${i===sortI?(sortDir>0?' ▲':' ▼'):''}</th>`).join('') + '</tr>';
  $('#gt tbody').innerHTML = rows.map(g => `<tr data-id="${g.appid}" class="${g.appid===selected?'sel':''}">` + cols.map(c => `<td class="${c[3]?'n':''}">${c[2](g)}</td>`).join('') + '</tr>').join('')
    || `<tr><td colspan="${cols.length}" class="muted" style="padding:18px">No games yet. Use “Refresh now / add games” to paste Steam store links.</td></tr>`;
  document.querySelectorAll('#gt th').forEach(th => th.onclick = () => { const i = +th.dataset.i; sortDir = i === sortI ? -sortDir : -1; sortI = i; drawGames(); });
  document.querySelectorAll('#gt tbody tr[data-id]').forEach(tr => tr.onclick = () => showDetail(+tr.dataset.id));
}
$('#q').oninput = drawGames; $('#grp').onchange = drawGames;
drawGames();

// ---------- detail ----------
let chart;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function showDetail(id){
  selected = id; drawGames();
  const g = D.games.find(x => x.appid === id), el = $('#detail');
  el.style.display = 'block';
  const z = D.assumptions.interval_z;
  const lang = g.lang_mix ? Object.entries(g.lang_mix).sort((a,b)=>b[1]-a[1]) : [];
  const palette = ['#1f5f8b','#c2410c','#2e7d4f','#7c3aed','#b45309','#0e7490','#be185d','#4d7c0f','#64748b'];
  el.innerHTML = `
    <h2>${esc(g.name)}</h2>
    <div class="sub">${esc((g.developers||[]).join(', '))}${g.publishers && g.publishers.length ? ' · published by ' + esc(g.publishers.join(', ')) : ''} · ${esc((g.genres||[]).join(', '))} ·
      <a target="_blank" href="https://store.steampowered.com/app/${g.appid}/">Steam page ↗</a></div>
    ${g.status !== 'ok' ? `<div class="note" style="margin-top:12px">${esc(g.status)}</div>` : ''}
    <div class="dgrid">
      <div>
        <div class="chartbox"><canvas id="ch"></canvas></div>
        <h3>By quarter (estimated)</h3>
        <div class="tablewrap" style="max-height:330px;overflow-y:auto"><table><thead><tr><th>Quarter</th><th class="n">Units</th><th class="n">Gross revenue</th></tr></thead><tbody>
          ${(g.quarterly||[]).slice().reverse().map(r => `<tr><td>${r[0]}</td><td class="n">${fmtN(r[1])}</td><td class="n">${fmt$(r[2])}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">—</td></tr>'}
        </tbody></table></div>
      </div>
      <div>
        <h3 style="margin-top:0">Estimate</h3>
        <dl>
          <dt>Units sold</dt><dd class="num">${fmtN(g.units)} <span class="range">(${fmtN(g.units_lo)}–${fmtN(g.units_hi)})</span></dd>
          <dt>Gross revenue</dt><dd class="num">${fmt$(g.gross)} <span class="range">(${fmt$(g.gross_lo)}–${fmt$(g.gross_hi)})</span></dd>
          <dt>Net to developer</dt><dd class="num">${fmt$(g.net)}</dd>
          <dt>Units, last 30 days</dt><dd class="num">${fmtN(g.units_30d)}</dd>
        </dl>
        <h3>Inputs</h3>
        <dl>
          <dt>Total reviews</dt><dd class="num">${fmtN(g.reviews)} (${pct(g.positive_pct)} positive)</dd>
          <dt>Sales per review</dt><dd class="num">${g.multiple ? g.multiple.toFixed(1)+'×' : '—'} <span class="muted">(published average for when its reviews were written: ${g.prior_multiple ?? '—'}×)</span></dd>
          <dt>Players now / max seen</dt><dd class="num">${fmtN(g.ccu)} / ${fmtN(g.ccu_max_seen)}</dd>
          <dt>Regional price factor</dt><dd class="num">${g.regional_factor ? g.regional_factor.toFixed(2) : '—'} <span class="muted">${g.regional_factor ? (g.regional_measured ? '(measured)' : '(default, not yet measured)') : ''}</span></dd>
        </dl>
        ${lang.length ? `<h3>Review language mix</h3>
          <div class="bar">${lang.map(([l,s],i)=>`<div title="${l} ${pct(s,1)}" style="width:${s*100}%;background:${palette[i%palette.length]}"></div>`).join('')}</div>
          <div class="sub">${lang.slice(0,6).map(([l,s],i)=>`<span style="color:${palette[i%palette.length]}">■</span> ${esc(l)} ${pct(s)}`).join(' &nbsp; ')}</div>` : ''}
        ${g.ground_truth && g.ground_truth.length ? `<h3>Known milestones</h3><dl>${g.ground_truth.map(r=>`<dt>${r.date}</dt><dd class="num">${fmtN(r.value)} ${esc(r.metric)} <span class="muted">(${esc(r.scope)})</span>${r.source_url?` <a target="_blank" href="${esc(r.source_url)}">source</a>`:''}</dd>`).join('')}</dl>` : ''}
      </div>
    </div>`;
  if (chart) chart.destroy();
  const s = g.series || [];
  if (!s.length || !window.Chart) return;
  const band = Math.exp(z * D.model.sd);
  const pts = s.map(r => ({x: Date.parse(r[0]), y: r[1]}));
  chart = new Chart($('#ch'), {
    data: { datasets: [
      {type:'line', label:'Low', data: pts.map(p=>({x:p.x,y:p.y/band})), borderWidth:0, pointRadius:0, fill:false},
      {type:'line', label:'High', data: pts.map(p=>({x:p.x,y:p.y*band})), borderWidth:0, pointRadius:0, fill:'-1', backgroundColor: css('--band')},
      {type:'line', label:'Estimated units (cumulative)', data: pts, borderColor: css('--accent'), borderWidth:2, pointRadius:0, tension:.2},
      {type:'scatter', label:'Known milestone', data:(g.ground_truth||[]).map(r=>({x:Date.parse(r.date), y:r.value})), backgroundColor: css('--gt'), pointRadius:5, pointStyle:'rectRot'},
    ]},
    options: { responsive:true, maintainAspectRatio:false, animation:false, interaction:{mode:'nearest', intersect:false},
      plugins:{ legend:{labels:{filter:i=>!['Low','High'].includes(i.text), color: css('--muted')}},
        tooltip:{callbacks:{title:it=>new Date(it[0].parsed.x).toISOString().slice(0,10), label:it=>`${it.dataset.label}: ${fmtN(it.parsed.y)}`}}},
      scales:{ x:{type:'linear', ticks:{color:css('--muted'), callback:v=>new Date(v).toISOString().slice(0,7), maxTicksLimit:8}, grid:{color:css('--line')}},
               y:{ticks:{color:css('--muted'), callback:v=>fmtN(v)}, grid:{color:css('--line')}, beginAtZero:true}}}
  });
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ---------- backtest ----------
const kp = (l, m, b, f) => `<div class="kpi"><div class="l">${l}</div><div class="v num">${m ? f(m) : '—'}</div><div class="d">baseline ${b ? f(b) : '—'}</div></div>`;
$('#btk').innerHTML = !bm ? `<div class="note">No backtest yet. Add dated, sourced sales milestones to the ground-truth file; each one becomes a test case.</div>` :
  kp('Milestones tested', bm, bb, s => s.n) + kp('Within ±30%', bm, bb, s => pct(s.within_30)) + kp('Within ±50%', bm, bb, s => pct(s.within_50)) +
  kp('Median error', bm, bb, s => pct(s.median_abs_pct_error)) + kp('Bias (median)', bm, bb, s => sPct(s.bias_pct));
const ec = v => Math.abs(v) <= .3 ? 'good' : Math.abs(v) <= .5 ? 'warn' : 'bad';
$('#bt thead').innerHTML = '<tr><th>Game</th><th>Date</th><th>Scope</th><th class="n">Reviews then</th><th class="n">Actual</th><th class="n">Model</th><th class="n">Error</th><th class="n">Flat prior</th><th class="n">Error</th><th>Source</th></tr>';
$('#bt tbody').innerHTML = D.backtest.rows.sort((a,b)=>Math.abs(b.error_pct)-Math.abs(a.error_pct)).map(r => `<tr style="cursor:default" class="${r.counted?'':'muted'}">
  <td>${esc(r.game)}${r.counted?'':` <span class="tag">${r.early?'launch-month':'reference'}</span>`}</td><td>${r.date}</td><td>${esc(r.scope)}</td><td class="n">${fmtN(r.reviews_at_date)}</td>
  <td class="n">${fmtN(r.actual)}</td><td class="n">${fmtN(r.predicted)}</td><td class="n ${r.counted?ec(r.error_pct):''}">${sPct(r.error_pct)}</td>
  <td class="n">${fmtN(r.baseline)}</td><td class="n ${r.counted?ec(r.baseline_error_pct):''}">${sPct(r.baseline_error_pct)}</td>
  <td>${r.source_url ? `<a target="_blank" href="${esc(r.source_url)}">link</a>` : ''}</td></tr>`).join('') || '<tr><td colspan="10" class="muted" style="padding:18px">No milestones yet.</td></tr>';
if (D.model.skipped.length) $('#skipped').innerHTML = `<h3>Milestones not used (${D.model.skipped.length})</h3><div class="tablewrap"><table><tbody>${D.model.skipped.map(s=>`<tr style="cursor:default"><td>${esc(s.row)}</td><td class="muted">${esc(s.reason)}</td></tr>`).join('')}</tbody></table></div>`;

// ---------- how it works ----------
const pri = Object.entries(D.priors).map(([y,m]) => `${y}${y==Math.min(...Object.keys(D.priors))?' and earlier':y==Math.max(...Object.keys(D.priors))?' and later':''}: ${m}×`).join(' · ');
const co = D.model.coefficients;
$('#p-how').innerHTML = `
<h3>What each number means</h3>
<ul>
<li><b>Est. units</b>: Steam copies sold to date = total Steam reviews × <b>sales per review</b> (the “multiple”). The grey range is a 90% band sized from the backtest error.</li>
<li><b>Sales per review</b> starts from published averages for the year each review was written (${pri}), because people review more often than they used to, and is adjusted by a model fitted to your ground truth for review volume, price, review score and game age. With few milestones the adjustments shrink to zero, so you get the published averages.</li>
<li><b>Est. gross revenue</b>: units sold in each month × the price paid that month, after regional pricing (from the review language mix and Steam’s country prices, ex-VAT) and refunds (${pct(D.assumptions.refund_rate)}), before Steam’s cut. Months where the crawler recorded Steam’s actual price use it; earlier months assume average discounts by game age (${D.assumptions.discounts.map(d=>`${d.from_month}–${d.to_month>999?'+':d.to_month}m: ${pct(d.discount)}`).join(', ')}).</li>
<li><b>Est. net revenue</b>: gross minus Steam’s tiered cut (30% / 25% above $10M / 20% above $50M).</li>
<li><b>Free-to-play</b> games show reviews and players only. Review multiples do not measure F2P money.</li>
</ul>
<h3>How to use it</h3>
<ul>
<li><b>Add games</b>: press “Refresh now / add games”, then <b>Run workflow</b>, paste Steam store links into the box, and run. Results appear here 5–30 minutes later.</li>
<li><b>Improve accuracy</b>: add sales milestones to the ground-truth file (one row each: Steam app ID, date, number, whether it is Steam-only, source link). Every row also becomes a backtest case.</li>
<li><b>Automatic refresh</b>: runs every morning on its own. Download the CSV files for Excel.</li>
</ul>
<h3>Current model</h3>
<p class="num" style="font-size:12px">${Object.entries(co).map(([k,v])=>`${k}: ${v.toFixed(3)}`).join(' · ')}</p>
<p class="muted">Run took ${D.run.seconds}s using ${D.run.store_calls} Steam store requests. Currency rates: ${esc(D.run.fx_source)}.</p>`;
</script>
</body>
</html>
